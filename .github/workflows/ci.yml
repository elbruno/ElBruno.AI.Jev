name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
  JEV_RUN_LIVE: '0'

defaults:
  run:
    shell: pwsh

jobs:
  verify:
    name: Verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.4xx'
      - name: Restore, build, and check formatting
        run: |
          dotnet restore ElBruno.AI.Jev.slnx
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet build ElBruno.AI.Jev.slnx --configuration Release --no-restore
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet format ElBruno.AI.Jev.slnx --verify-no-changes --no-restore
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Offline unit tests and coverage
        run: |
          & .\scripts\Test-Coverage.Tests.ps1
          & .\scripts\Test-ReleasePolicy.Tests.ps1
          $project = (Resolve-Path .\tests\ElBruno.AI.Jev.Tests\ElBruno.AI.Jev.Tests.csproj).Path
          $results = Join-Path (Join-Path $PWD artifacts) coverage
          dotnet test $project --configuration Release --no-build --no-restore --settings coverage.runsettings --collect 'XPlat Code Coverage' --logger trx --results-directory $results
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & .\scripts\Test-Coverage.ps1 -ReportDirectory $results
      - name: Confirm live tests remain opt-in
        run: |
          $project = (Resolve-Path .\tests\ElBruno.AI.Jev.IntegrationTests\ElBruno.AI.Jev.IntegrationTests.csproj).Path
          dotnet test $project --configuration Release --no-build --no-restore --logger trx --results-directory (Join-Path (Join-Path $PWD artifacts) integration)
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Compile and run every sample with explicit offline fixtures
        run: |
          $projects = @(Get-ChildItem samples -Filter *.csproj -Recurse -File)
          if ($projects.Count -eq 0) { throw 'No sample projects found.' }
          foreach ($project in $projects) {
            dotnet build $project.FullName --configuration Release
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            dotnet run --project $project.FullName --configuration Release --no-build --no-restore -- --offline
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Pack and test the isolated consumer
        run: |
          $project = (Resolve-Path .\src\ElBruno.AI.Jev\ElBruno.AI.Jev.csproj).Path
          $packages = Join-Path (Join-Path $PWD artifacts) packages
          dotnet pack $project --configuration Release --no-build --no-restore --output $packages
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & .\scripts\Test-Package.ps1 -PackageDirectory $packages
      - name: Upload test and package evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-${{ matrix.os }}
          path: artifacts
          if-no-files-found: warn

  macos-smoke:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.4xx'
      - name: Restore, build, and run offline smoke tests
        run: |
          dotnet restore ElBruno.AI.Jev.slnx
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet build ElBruno.AI.Jev.slnx --configuration Release --no-restore
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $project = (Resolve-Path .\tests\ElBruno.AI.Jev.Tests\ElBruno.AI.Jev.Tests.csproj).Path
          dotnet test $project --configuration Release --no-build --no-restore --logger trx --results-directory (Join-Path (Join-Path $PWD artifacts) smoke)
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macos-smoke
          path: artifacts
          if-no-files-found: warn
