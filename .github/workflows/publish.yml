name: Validate or publish NuGet

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Exact SemVer to validate, for example 0.5.0 (no v prefix)'
        required: true
        type: string
      ref:
        description: 'Existing release tag or full commit SHA to build'
        required: true
        type: string
      approve-unverified-publication:
        description: 'Approve publishing a preview or tentative 0.5.0 despite unverified live Jev compatibility'
        required: true
        default: false
        type: boolean
      verify-published-run:
        description: 'Optional original publication run ID: verify its public package only, never push again'
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: publish-ElBruno.AI.Jev
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
  JEV_RUN_LIVE: '0'

defaults:
  run:
    shell: pwsh

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.metadata.outputs.version }}
      repository: ${{ steps.metadata.outputs.repository }}
      publish_allowed: ${{ steps.metadata.outputs.publish_allowed }}
      verification_run: ${{ steps.metadata.outputs.verification_run }}
      commit: ${{ steps.commit.outputs.commit }}
    steps:
      - name: Checkout release-policy implementation
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate release version and requested ref
        id: metadata
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_REF: ${{ inputs.ref }}
          APPROVE_UNVERIFIED_PUBLICATION: ${{ inputs.approve-unverified-publication }}
          VERIFY_PUBLISHED_RUN: ${{ inputs.verify-published-run }}
        run: |
          & .\scripts\Test-ReleasePolicy.Tests.ps1
          $metadata = & .\scripts\Get-ReleaseMetadata.ps1 -EventName $env:EVENT_NAME -ReleaseTag $env:RELEASE_TAG `
            -Version $env:INPUT_VERSION -Ref $env:INPUT_REF -Repository $env:GITHUB_REPOSITORY `
            -ApproveUnverifiedPublication:($env:APPROVE_UNVERIFIED_PUBLICATION -ceq 'true') -VerifyPublishedRun $env:VERIFY_PUBLISHED_RUN
          $publishAllowed = $metadata.PublishAllowed.ToString().ToLowerInvariant()
          "version=$($metadata.Version)" >> $env:GITHUB_OUTPUT
          "repository=$($metadata.RepositoryUrl)" >> $env:GITHUB_OUTPUT
          "publish_allowed=$publishAllowed" >> $env:GITHUB_OUTPUT
          "verification_run=$($metadata.VerificationRun)" >> $env:GITHUB_OUTPUT
          if ($metadata.VerificationRun) {
            'Public verification only: use the original artifacts, with no rebuild, NuGet publication, or OIDC exchange.' >> $env:GITHUB_STEP_SUMMARY
          } elseif ($publishAllowed -eq 'false') {
            'Validation only: no NuGet publication or OIDC exchange. An explicitly approved manual preview or tentative 0.5.0 dispatch is required to publish.' >> $env:GITHUB_STEP_SUMMARY
          } else {
            'Tentative publication explicitly approved. Live Jev compatibility remains unverified; this is not a production-readiness claim.' >> $env:GITHUB_STEP_SUMMARY
          }
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.ref }}
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve immutable release commit
        id: commit
        run: |
          $commit = git rev-parse HEAD
          if ($LASTEXITCODE -ne 0 -or $commit -notmatch '^[0-9a-fA-F]{40}$') { throw 'Could not resolve a release commit.' }
          "commit=$commit" >> $env:GITHUB_OUTPUT

  validate:
    needs: prepare
    if: ${{ needs.prepare.outputs.verification_run == '' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      PACKAGE_VERSION: ${{ needs.prepare.outputs.version }}
      REPOSITORY_URL: ${{ needs.prepare.outputs.repository }}
      RELEASE_COMMIT: ${{ needs.prepare.outputs.commit }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.4xx'
      - name: Restore, build, formatting, offline tests, and coverage
        run: |
          $properties = @("-p:Version=$env:PACKAGE_VERSION", "-p:RepositoryUrl=$env:REPOSITORY_URL", "-p:RepositoryCommit=$env:RELEASE_COMMIT")
          dotnet restore ElBruno.AI.Jev.slnx @properties
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet build ElBruno.AI.Jev.slnx --configuration Release --no-restore @properties
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet format ElBruno.AI.Jev.slnx --verify-no-changes --no-restore
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & .\scripts\Test-Coverage.Tests.ps1
          & .\scripts\Test-ReleasePolicy.Tests.ps1
          $tests = (Resolve-Path .\tests\ElBruno.AI.Jev.Tests\ElBruno.AI.Jev.Tests.csproj).Path
          $results = Join-Path (Join-Path $PWD artifacts) coverage
          dotnet test $tests --configuration Release --no-build --no-restore --settings coverage.runsettings --collect 'XPlat Code Coverage' --logger trx --results-directory $results @properties
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & .\scripts\Test-Coverage.ps1 -ReportDirectory $results
          $integration = (Resolve-Path .\tests\ElBruno.AI.Jev.IntegrationTests\ElBruno.AI.Jev.IntegrationTests.csproj).Path
          dotnet test $integration --configuration Release --no-build --no-restore --logger trx --results-directory (Join-Path (Join-Path $PWD artifacts) integration) @properties
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Compile and run every sample without calling services
        run: |
          $projects = @(Get-ChildItem samples -Filter *.csproj -Recurse -File)
          if ($projects.Count -eq 0) { throw 'No sample projects found.' }
          foreach ($project in $projects) {
            dotnet build $project.FullName --configuration Release "-p:Version=$env:PACKAGE_VERSION"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            dotnet run --project $project.FullName --configuration Release --no-build --no-restore "-p:Version=$env:PACKAGE_VERSION" -- --offline
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Pack exact release and verify Source Link and consumer
        run: |
          $project = (Resolve-Path .\src\ElBruno.AI.Jev\ElBruno.AI.Jev.csproj).Path
          $packages = Join-Path (Join-Path $PWD artifacts) packages
          $properties = @("-p:Version=$env:PACKAGE_VERSION", "-p:RepositoryUrl=$env:REPOSITORY_URL", "-p:RepositoryCommit=$env:RELEASE_COMMIT",
            "-p:PackageProjectUrl=$env:REPOSITORY_URL", "-p:PackageReleaseNotes=Tentative early-access SDK $env:PACKAGE_VERSION. Live Jev compatibility is unverified. Evaluate before production use. See $env:REPOSITORY_URL/releases.")
          dotnet pack $project --configuration Release --no-restore --output $packages @properties
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & .\scripts\Test-Package.ps1 -PackageDirectory $packages -Version $env:PACKAGE_VERSION -RequireSourceLink -ExpectedRepositoryUrl $env:REPOSITORY_URL
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-evidence-${{ matrix.os }}
          path: |
            artifacts/coverage
            artifacts/integration
          if-no-files-found: warn
      - name: Preserve exact validated package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-packages-${{ matrix.os }}
          path: artifacts/packages
          if-no-files-found: error

  publish:
    needs: [prepare, validate]
    if: ${{ success() && needs.prepare.outputs.publish_allowed == 'true' && needs.prepare.outputs.verification_run == '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: release
    permissions:
      contents: read
      id-token: write
    env:
      PACKAGE_VERSION: ${{ needs.prepare.outputs.version }}
      REPOSITORY_URL: ${{ needs.prepare.outputs.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.4xx'
      - uses: actions/download-artifact@v4
        with:
          name: release-packages-ubuntu-latest
          path: artifacts/packages
      - name: Recheck downloaded package artifacts
        run: |
          & .\scripts\Test-Package.ps1 -PackageDirectory (Join-Path (Join-Path $PWD artifacts) packages) -Version $env:PACKAGE_VERSION -RequireSourceLink -ExpectedRepositoryUrl $env:REPOSITORY_URL
      - name: Exchange OIDC using the existing trusted-publishing policy
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}
      - name: Push validated package and its adjacent symbol package
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: |
          $package = Join-Path (Join-Path (Join-Path $PWD artifacts) packages) "ElBruno.AI.Jev.$env:PACKAGE_VERSION.nupkg"
          dotnet nuget push $package --source https://api.nuget.org/v3/index.json --api-key $env:NUGET_API_KEY --timeout 300
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify public indexing and exact restored package
        run: |
          & .\scripts\Test-Package.ps1 -PackageDirectory (Join-Path (Join-Path $PWD artifacts) packages) -Version $env:PACKAGE_VERSION -RequireSourceLink -ExpectedRepositoryUrl $env:REPOSITORY_URL -UsePublicFeed -IndexAttempts 20 -IndexDelaySeconds 60
          "Verified ElBruno.AI.Jev $env:PACKAGE_VERSION from public NuGet using a fresh isolated cache and offline consumer." >> $env:GITHUB_STEP_SUMMARY

  verify-public:
    needs: prepare
    if: ${{ needs.prepare.outputs.verification_run != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      actions: read
    env:
      PACKAGE_VERSION: ${{ needs.prepare.outputs.version }}
      REPOSITORY_URL: ${{ needs.prepare.outputs.repository }}
      RELEASE_COMMIT: ${{ needs.prepare.outputs.commit }}
      PUBLICATION_RUN: ${{ needs.prepare.outputs.verification_run }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          persist-credentials: false
      - name: Verify original publication run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $run = gh api "repos/$env:GITHUB_REPOSITORY/actions/runs/$env:PUBLICATION_RUN" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($run.path -cne '.github/workflows/publish.yml' -or $run.event -cne 'workflow_dispatch' -or
              $run.head_repository.full_name -cne $env:GITHUB_REPOSITORY -or $run.status -cne 'completed') {
            throw 'Expected a completed manual publication run in this repository.'
          }
      - uses: actions/download-artifact@v4
        with:
          name: release-packages-ubuntu-latest
          path: artifacts/packages
          run-id: ${{ needs.prepare.outputs.verification_run }}
          github-token: ${{ github.token }}
      - name: Match original package to the requested source revision
        run: |
          $path = Join-Path (Join-Path (Join-Path $PWD artifacts) packages) "ElBruno.AI.Jev.$env:PACKAGE_VERSION.nupkg"
          $archive = [IO.Compression.ZipFile]::OpenRead($path)
          try {
            $entry = $archive.GetEntry('ElBruno.AI.Jev.nuspec')
            if ($null -eq $entry) { throw 'Missing package manifest.' }
            $stream = $entry.Open()
            try {
              $manifest = [Xml.XmlDocument]::new()
              $manifest.XmlResolver = $null
              $manifest.Load($stream)
            } finally { $stream.Dispose() }
            $repository = $manifest.SelectSingleNode("/*[local-name()='package']/*[local-name()='metadata']/*[local-name()='repository']")
            if ($null -eq $repository -or $repository.GetAttribute('url') -cne $env:REPOSITORY_URL -or
                $repository.GetAttribute('commit') -cne $env:RELEASE_COMMIT) {
              throw 'Original artifacts do not match the requested repository and immutable source revision.'
            }
          } finally { $archive.Dispose() }
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.4xx'
      - name: Verify public indexing and original package without republishing
        run: |
          & .\scripts\Test-Package.ps1 -PackageDirectory (Join-Path (Join-Path $PWD artifacts) packages) -Version $env:PACKAGE_VERSION -RequireSourceLink -ExpectedRepositoryUrl $env:REPOSITORY_URL -UsePublicFeed -IndexAttempts 20 -IndexDelaySeconds 60
          "Verified public ElBruno.AI.Jev $env:PACKAGE_VERSION against original artifacts from run $env:PUBLICATION_RUN. No package was rebuilt or republished." >> $env:GITHUB_STEP_SUMMARY
